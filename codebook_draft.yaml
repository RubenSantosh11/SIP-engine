# DRAFT codebook from Stage 3 open coding. Curate it into codebook.yaml (merge, rename, delete),
# set status: final, and log your edits in corrections_log.md. draft_* fields are for your reference.
status: draft
addressability_scores:
  high: 1.0
  medium: 0.6
  low: 0.3
themes:
- id: beh_steady_continuing
  question: behaviour
  name: Steady continuing
  definition: Writer has kept SIPs going for months or years with no major issues.
  include: Years of continuing, steady accumulation, easy ongoing management.
  exclude: Continuing despite losses (use beh_holding_through_falls).
  example: using this application from last 3 years for sip management
  example_source: appstore
  addressability: medium
  exclude_from_droppers: false
  draft_n_codes: 9
  draft_n_records: 8
  draft_sources:
  - appstore
  - playstore
  - tradingqna
  - youtube
  draft_member_codes:
  - was steady for 3 years
  - long-term continuing investor
  - long-time SIP user adding new SIPs
  - continuing since 2020 with easy management
  - easy SIP management
  - steady accumulation keeps them going
  - 5 years in
  - 1.5 years in and continuing
  - agent-started SIPs still running
- id: beh_monitoring_returns
  question: behaviour
  name: 'Watching returns: flat, negative or disappointing'
  definition: Writer tracks returns in the months/years after starting and reports flat, negative or disappointing
    results, or feeling misled.
  include: Being at a loss, zero returns after N years, comparing to index levels, feeling misled about returns.
  exclude: Stopping because of returns (use stop_poor_returns).
  example: I started sip in small cap fund in jan 2024 and continue till now
  example_source: youtube
  addressability: medium
  exclude_from_droppers: false
  draft_n_codes: 9
  draft_n_records: 8
  draft_sources:
  - appstore
  - tradingqna
  - youtube
  draft_member_codes:
  - 3 years in, comparing fund performance
  - tracks portfolio regularly
  - sitting on losses after peak entry
  - feels misled by creator advice
  - flat value after 2 years
  - disappointed by single-digit returns
  - zero returns for over two years but continued
  - tracks returns against index level
  - 2 years in and at a loss
- id: beh_switching_restructuring
  question: behaviour
  name: Switching / restructuring holdings
  definition: Switches platform or plan, restarts in another mode, trims funds, or times cancellation around exit
    load.
  include: Platform switches, regular to direct, restarting mode, too many funds, exit-load timing.
  exclude: Switch-driven stops (use stop_switch_plan_or_platform).
  example: I just switched to coins from my previous Brokerage house because of facility of Direct funds
  example_source: tradingqna
  addressability: medium
  exclude_from_droppers: false
  draft_n_codes: 7
  draft_n_records: 7
